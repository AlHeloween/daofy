# Daofy for Delphi — client rule installation descriptor
# Read by client_rules_installer; installs daofy-delphi.md into the corresponding MCP client's rules directory.
rule:
  id: daofy-delphi
  version: "2026.07.14.3"
  source: "Daofy for Delphi MCP Server"
  file: daofy-delphi.md              # the rule file to install (in the same directory as this file)
  managed_filename: daofy-delphi.md  # file name in the client's rules directory after installation

  # Extensions considered Delphi files, which must be read/written with delphi_file
  extensions:
    - .pas
    - .dpr
    - .dpk
    - .dfm
    - .fmx
    - .inc
    - .dproj
    - .groupproj

  # Client match → rules directory (relative to the user's home directory)
  # match is a substring of clientInfo.name (case-insensitive).
  #
  # Note: Tongyi Lingma / Comate / MarsCode etc. are mostly IDE plugins; when connecting via MCP,
  # clientInfo.name is the host IDE (e.g. "Visual Studio Code" / "IntelliJ IDEA"),
  # not the tool name, so they cannot be matched by name. For such cases, use DAOFY_CLIENT_RULES_DIR
  # to specify the directory manually, or rely on CodeBuddy user-level rules.
  # Wenxin Kuaima (Comate) rules are in JSON format (not a markdown directory mechanism) and are not listed here.
  clients:
    - match: ["codebuddy"]
      rules_dir: ".codebuddy/rules"
      format: markdown
    - match: ["cursor"]
      rules_dir: ".cursor/rules"
      format: markdown
      frontmatter:
        alwaysApply: true
        description: "Daofy Delphi file read/write routing rule"
        globs:
          - "*.pas"
          - "*.dpr"
          - "*.dpk"
          - "*.dfm"
          - "*.fmx"
          - "*.inc"
          - "*.dproj"
          - "*.groupproj"
    - match: ["claude"]
      rules_dir: ".claude/rules"
      format: markdown
    - match: ["trae"]
      rules_dir: ".trae/rules"
      format: markdown
      frontmatter:
        alwaysApply: true
        description: "Daofy Delphi file read/write routing rule"
        globs:
          - "*.pas"
          - "*.dpr"
          - "*.dpk"
          - "*.dfm"
          - "*.fmx"
          - "*.inc"
          - "*.dproj"
          - "*.groupproj"
    - match: ["lingma", "qoder", "tongyi"]
      rules_dir: ".lingma/rules"
      format: markdown
    - match: ["codearts"]
      # Huawei Cloud CodeArts (CodeArts Doer/Snap) explicitly supports AGENTS.md:
      # personal-level rules placed in %USERPROFILE%/.codeartsdoer/AGENTS.md are recognized automatically.
      # The internal format of the ordinary .codeartsdoer/rule/ directory is opaque, so the AGENTS.md path is the most reliable.
      rules_dir: ".codeartsdoer"
      managed_filename: "AGENTS.md"
      format: markdown

